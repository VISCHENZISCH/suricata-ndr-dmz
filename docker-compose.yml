name: suricata-ndr-dmz

networks:
  dmz:
    name: suricata-ndr-dmz-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  #*****************************************
  #     Serveur Web Nginx
  #*****************************************
  web:
    image: nginx:1.27-alpine
    container_name: g2-web
    hostname: web
    networks:
      dmz:
        ipv4_address: 172.20.0.10
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./dmz/web:/usr/share/nginx/html:ro
      - ./dmz/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  #*****************************************
  #     API FastAPI
  #*****************************************
  api:
    build: ./dmz/api
    container_name: g2-api
    hostname: api
    networks:
      dmz:
        ipv4_address: 172.20.0.12
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: g2db
      POSTGRES_USER: g2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: http://localhost:8082
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
#*********************************************
#     Serveur de base de données PostgreSQL
#*********************************************
  db:
    image: postgres:16-alpine
    container_name: g2-db
    hostname: db
    networks:
      dmz:
        ipv4_address: 172.20.0.11
    environment:
      POSTGRES_DB: g2db
      POSTGRES_USER: g2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./dmz/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g2user -d g2db"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  #*****************************************
  #     Console d'alertes EveBox
  #*****************************************
  evebox:
    image: jasonish/evebox:0.32.0
    container_name: g2-evebox
    hostname: evebox
    networks:
      dmz:
        ipv4_address: 172.20.0.14
    ports:
      - "127.0.0.1:5636:5636"
    environment:
      EVEBOX_USER: ${EVEBOX_USER}
      EVEBOX_PASSWORD: ${EVEBOX_PASSWORD}
    volumes:
      - ./evebox/evebox.yaml:/etc/evebox/evebox.yaml:ro
      - ./evebox/entrypoint.sh:/usr/local/bin/evebox-entrypoint.sh:ro
      - suricata-logs:/var/log/suricata:ro
      - evebox-data:/var/lib/evebox
    entrypoint: ["/bin/sh", "/usr/local/bin/evebox-entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # L'image EveBox ne contient pas wget mais curl. /ping repond sans
      # authentification : la page d'accueil, elle, renvoie 401 par conception.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5636/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  #*****************************************
  #     Sonde NDR Suricata
  #*****************************************
  # La capture se fait sur le bridge Docker de la DMZ. Un conteneur pose
  # simplement sur ce reseau ne verrait que son propre trafic : le bridge
  # commute port par port et n'inonde pas les autres ports, et passer son veth
  # en promiscuite n'y change rien. La sonde partage donc la pile reseau de
  # l'hote, retrouve l'interface br-xxxx par l'adresse de passerelle et la passe
  # en mode promiscuous (voir suricata/entrypoint.sh) : le noyau clone alors
  # chaque trame commutee vers la pile locale, ou af-packet la recupere.
  suricata:
    build: ./suricata
    image: g2/suricata-ndr:7.0.17
    container_name: g2-suricata
    hostname: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      DMZ_GATEWAY: "172.20.0.1"
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules/local.rules:/var/lib/suricata/rules/local.rules:ro
      - suricata-logs:/var/log/suricata
      - suricata-rules:/var/lib/suricata/rules
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "suricatasc", "-c", "uptime"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  #*****************************************
  #     Conteneur attaquant (scenario)
  #*****************************************
  # Profil "attack" : il ne demarre pas avec la pile, on l'invoque pour la
  # demonstration. Il est branche sur la DMZ comme un poste externe et reste
  # hors de HOME_NET, ce qui permet aux regles de reconnaissance de se
  # declencher (une source interne a HOME_NET ne serait pas "externe").
  attacker:
    build: ./attacker
    image: g2/attacker:1.0
    container_name: g2-attacker
    hostname: attaquant
    profiles: ["attack"]
    networks:
      dmz:
        ipv4_address: 172.20.0.2
    environment:
      WEB_HOST: "172.20.0.10"
      API_HOST: "172.20.0.12"
      DB_HOST: "172.20.0.11"
      EVEBOX_HOST: "172.20.0.14"
      PAUSE_SECONDS: "4"
      DNS_RESOLVER: ${DNS_RESOLVER:-}
    depends_on:
      web:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
      - /root
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
volumes:
  db-data:
  suricata-logs:
  suricata-rules:
  evebox-data:
