name: suricata-ndr-dmz

# Journalisation bornee : sans plafond, un conteneur bavard remplit le disque
# de l'hote et fait tomber la pile (y compris la sonde). 30 Mo par service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  dmz:
    name: suricata-ndr-dmz-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  # Réseau dédié à la pile de supervision : la sonde (qui écoute le bridge DMZ)
  # ne voit ainsi pas le trafic Promtail -> Loki, qui contient les alertes elles-mêmes
  # et provoquerait sinon des alertes en boucle.
  monitoring:
    name: suricata-ndr-monitoring-net
    driver: bridge

services:
  #*****************************************
  #     Serveur Web Nginx
  #*****************************************
  web:
    image: nginx:1.27-alpine
    container_name: g2-web
    logging: *default-logging
    hostname: web
    networks:
      dmz:
        ipv4_address: 172.20.0.10
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./dmz/web:/usr/share/nginx/html:ro
      - ./dmz/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx (master root) a besoin de : se lier au port 80, ecrire son pid et
    # son cache, puis abandonner vers le compte nginx.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  #*****************************************
  #     API FastAPI
  #*****************************************
  api:
    build: ./dmz/api
    container_name: g2-api
    logging: *default-logging
    hostname: api
    networks:
      dmz:
        ipv4_address: 172.20.0.12
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: g2db
      POSTGRES_USER: g2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: http://localhost:8082,http://127.0.0.1:8082
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 256m
    pids_limit: 64
    tmpfs:
      - /tmp
    restart: unless-stopped
#*********************************************
#     Serveur de base de données PostgreSQL
#*********************************************
  db:
    image: postgres:16-alpine
    container_name: g2-db
    logging: *default-logging
    hostname: db
    networks:
      dmz:
        ipv4_address: 172.20.0.11
    environment:
      POSTGRES_DB: g2db
      POSTGRES_USER: g2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./dmz/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./dmz/db/harden-hba.sh:/docker-entrypoint-initdb.d/harden-hba.sh:ro
      - db-data:/var/lib/postgresql/data
    # Racine en lecture seule : seul le volume de donnees est inscriptible,
    # le socket et les fichiers temporaires passent par tmpfs.
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # L'entrypoint PostgreSQL chown/chmod le volume de donnees puis abandonne
    # vers le compte postgres : seules ces capacites sont conservees.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g2user -d g2db"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  #*****************************************
  #     Console d'alertes EveBox
  #*****************************************
  # ------------ Service tls-init : génère l'AC locale + certificats SAN ----------
  tls-init:
    build: ./tls
    image: g2/tls-init:1.0
    container_name: g2-tls-init
    logging: *default-logging
    volumes:
      - tls-certs:/certs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    restart: "no"

  evebox:
    image: jasonish/evebox:0.32.0
    container_name: g2-evebox
    logging: *default-logging
    hostname: evebox
    networks:
      dmz:
        ipv4_address: 172.20.0.14
    depends_on:
      tls-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5636:5636"
    environment:
      EVEBOX_USER: ${EVEBOX_USER}
      EVEBOX_PASSWORD: ${EVEBOX_PASSWORD}
    volumes:
      - ./evebox/evebox.yaml:/etc/evebox/evebox.yaml:ro
      - ./evebox/entrypoint.sh:/usr/local/bin/evebox-entrypoint.sh:ro
      - suricata-logs:/var/log/suricata:ro
      - evebox-data:/var/lib/evebox
      - tls-certs:/etc/evebox/tls:ro
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["/bin/sh", "/usr/local/bin/evebox-entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      # EveBox écoute désormais en HTTPS ; --cacert valide le certificat auto-signé.
      test: ["CMD", "curl", "-fsS", "--cacert", "/etc/evebox/tls/ca.crt", "-o", "/dev/null", "https://127.0.0.1:5636/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  #*****************************************
  #     Sonde NDR Suricata
  #*****************************************
  # La capture se fait sur le bridge Docker de la DMZ. Un conteneur pose
  # simplement sur ce reseau ne verrait que son propre trafic : le bridge
  # commute port par port et n'inonde pas les autres ports, et passer son veth
  # en promiscuite n'y change rien. La sonde partage donc la pile reseau de
  # l'hote, retrouve l'interface br-xxxx par l'adresse de passerelle et la passe
  # en mode promiscuous (voir suricata/entrypoint.sh) : le noyau clone alors
  # chaque trame commutee vers la pile locale, ou af-packet la recupere.
  suricata:
    build: ./suricata
    image: g2/suricata-ndr:7.0.17
    container_name: g2-suricata
    logging: *default-logging
    hostname: suricata
    network_mode: host
    cap_add:
      # NET_ADMIN : passer le bridge en mode promiscuous
      # NET_RAW   : capture af-packet
      # SYS_NICE  : ordonnancement des threads de capture
      # CHOWN     : rendre les volumes de logs au compte suricata
      # DAC_OVERRIDE : acceder au volume de regles possede par suricata
      # SETUID/SETGID/SETPCAP : abandon de privileges vers le compte suricata
      # (Suricata ouvre la capture en root puis tourne en non-root)
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
    environment:
      DMZ_GATEWAY: "172.20.0.1"
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules/local.rules:/var/lib/suricata/rules/local.rules:ro
      - suricata-logs:/var/log/suricata
      - suricata-rules:/var/lib/suricata/rules
    # Racine en lecture seule : journaux et regles vivent dans des volumes,
    # le pid et le socket de commande dans un tmpfs.
    read_only: true
    tmpfs:
      - /var/run/suricata
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "suricatasc", "-c", "uptime"]
      interval: 20s
      timeout: 5s
      retries: 3
      # Le chargement des 53 000 signatures ET Open prend environ 90 s sur une
      # machine de portable : en dessous, la sonde etait declaree unhealthy
      # alors qu'elle chargeait encore ses regles.
      start_period: 180s
    restart: unless-stopped
  #***********************************************
  #     Supervision : Promtail -> Loki -> Grafana
  #***********************************************
  loki:
    image: grafana/loki:3.2.0
    container_name: g2-loki
    logging: *default-logging
    healthcheck:
      # /ready reste a 503 en mono-binaire avec l'anneau in-memory ; on teste le
      # chemin de lecture, qui ne repond 200 que si Loki sert reellement.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/loki/api/v1/labels || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    hostname: loki
    networks: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 128
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.0
    container_name: g2-promtail
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9080/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    hostname: promtail
    networks: [monitoring]
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    depends_on: [loki]
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - promtail-pos:/positions
      - suricata-logs:/var/log/suricata:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: g2-mailpit
    logging: *default-logging
    hostname: mailpit
    networks: [monitoring]
    environment:
      MP_SMTP_RELAY_CONFIG: ${MAILPIT_RELAY_CONFIG:-}
      MP_SMTP_RELAY_MATCHING: ${MAILPIT_RELAY_MATCHING:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    volumes:
      - ./mailpit/entrypoint.sh:/usr/local/bin/mailpit-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/mailpit-entrypoint.sh"]
    ports:
      - "127.0.0.1:8025:8025"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: g2-grafana
    logging: *default-logging
    hostname: grafana
    networks: [monitoring]
    depends_on:
      loki:
        condition: service_started
      mailpit:
        condition: service_started
      tls-init:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@g2.local
      ALERT_EMAIL: ${ALERT_EMAIL:-soc@g2.local}
      # --- TLS : Grafana écoute en HTTPS ---
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/tls/grafana.crt
      GF_SERVER_CERT_KEY: /etc/grafana/tls/grafana.key
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tls-certs:/etc/grafana/tls:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      # Grafana écoute en HTTPS ; --no-check-certificate pour le cert auto-signé.
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  #*****************************************
  #     Conteneur attaquant (scénario)
  #*****************************************
  attacker:
    build: ./attacker
    image: g2/attacker:1.0
    container_name: g2-attacker
    logging: *default-logging
    hostname: attaquant
    profiles: ["attack"]
    networks:
      dmz:
        ipv4_address: 172.20.0.2
    environment:
      WEB_HOST: "172.20.0.10"
      API_HOST: "172.20.0.12"
      DB_HOST: "172.20.0.11"
      EVEBOX_HOST: "172.20.0.14"
      PAUSE_SECONDS: "4"
      DNS_RESOLVER: ${DNS_RESOLVER:-}
    depends_on:
      web:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
      - /root
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
volumes:
  db-data:
  suricata-logs:
  suricata-rules:
  evebox-data:
  loki-data:
  promtail-pos:
  grafana-data:
  tls-certs:
