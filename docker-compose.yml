name: suricata-ndr-dmz

networks:
  dmz:
    name: suricata-ndr-dmz-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  #*****************************************
  #     Serveur Web Nginx
  #*****************************************
  web:
    image: nginx:1.27-alpine
    container_name: g2-web
    hostname: web
    networks:
      dmz:
        ipv4_address: 172.20.0.10
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./dmz/web:/usr/share/nginx/html:ro
      - ./dmz/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  #*****************************************
  #     API FastAPI
  #*****************************************
  api:
    build: ./dmz/api
    container_name: g2-api
    hostname: api
    networks:
      dmz:
        ipv4_address: 172.20.0.12
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: g2db
      POSTGRES_USER: g2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: http://localhost:8082
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
#*********************************************
#     Serveur de base de données PostgreSQL
#*********************************************
  db:
    image: postgres:16-alpine
    container_name: g2-db
    hostname: db
    networks:
      dmz:
        ipv4_address: 172.20.0.11
    environment:
      POSTGRES_DB: g2db
      POSTGRES_USER: g2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./dmz/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g2user -d g2db"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  #*****************************************
  #     Console d'alertes EveBox
  #*****************************************
  evebox:
    image: jasonish/evebox:0.32.0
    container_name: g2-evebox
    hostname: evebox
    networks:
      dmz:
        ipv4_address: 172.20.0.14
    ports:
      - "127.0.0.1:5636:5636"
    environment:
      EVEBOX_USER: ${EVEBOX_USER}
      EVEBOX_PASSWORD: ${EVEBOX_PASSWORD}
    volumes:
      - ./evebox/evebox.yaml:/etc/evebox/evebox.yaml:ro
      - ./evebox/entrypoint.sh:/usr/local/bin/evebox-entrypoint.sh:ro
      - suricata-logs:/var/log/suricata:ro
      - evebox-data:/var/lib/evebox
    entrypoint: ["/bin/sh", "/usr/local/bin/evebox-entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5636/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  db-data:
  suricata-logs:
  evebox-data:
