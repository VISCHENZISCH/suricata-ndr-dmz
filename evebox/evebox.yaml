# Configuration EveBox Groupe 2 (Suricata NDR / DMZ)
data-directory: /var/lib/evebox

http:
  host: "0.0.0.0"
  port: 5636
  tls:
    enabled: true
    certificate: /etc/evebox/tls/evebox.crt
    key: /etc/evebox/tls/evebox.key

authentication:
  required: true
  type: usernamepassword

database:
  type: sqlite
  retention:
    days: 7

input:
  enabled: true
  paths:
    - "/var/log/suricata/eve.json"
    - "/var/log/suricata/eve.*.json"
