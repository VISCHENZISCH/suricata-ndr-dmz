server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx dans l'en-tete Server (fingerprinting).
    server_tokens off;

    # En-tetes de securite. `always` les emet aussi sur les reponses d'erreur.
    # - nosniff : interdit au navigateur de deviner le type MIME
    # - DENY    : interdit l'affichage du portail dans une iframe (clickjacking)
    # - CSP     : tout vient de l'origine ; 'unsafe-inline' n'est tolere que pour
    #             les styles, quelques pages utilisant l'attribut style="..."
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Évite les 404 parasites dans les journaux et métriques RED Grafana
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Toutes les requêtes /api/* → API FastAPI (interne DMZ)
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Fichiers statiques du frontend
    location / {
        try_files $uri $uri/ =404;
    }
}
