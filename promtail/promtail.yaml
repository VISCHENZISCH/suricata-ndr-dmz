server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: suricata-eve
    static_configs:
      - targets: [localhost]
        labels:
          job: suricata
          __path__: /var/log/suricata/eve.json
    pipeline_stages:
      # Labels à faible cardinalité uniquement ; le reste s'extrait à la requête (| json)
      - json:
          expressions:
            event_type: event_type
            severity: alert.severity
      - labels:
          event_type:
          severity:
